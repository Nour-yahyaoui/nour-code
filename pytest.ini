[pytest]
testpaths = tests
# Make the repository root importable so that a bare `pytest` (console script,
# i.e. without `python -m`) finds the `nour_code` package without an editable
# install.  Without this, collection dies with ModuleNotFoundError in CI.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
