<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nour-code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='.55'%3E%3Cstop%20stop-color='%23d9ff63'/%3E%3Cstop%20offset='1'%20stop-color='%236c8cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='512'%20height='512'%20rx='116'%20fill='%230b0d12'/%3E%3Cg%20fill='none'%20stroke='url(%23g)'%20stroke-width='58'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M150%20158v196'/%3E%3Cpath%20d='M150%20158l212%20196'/%3E%3Cpath%20d='M362%20158v196'/%3E%3C/g%3E%3C/svg%3E" />
<meta name="theme-color" content="#07080b" />
<style>
  /* ------------------------------------------------------------------
     nour-code console — minimal, two themes, no icon fonts.
     Every glyph is an inline SVG symbol (see #sprite below).
  ------------------------------------------------------------------ */
  :root {
    --bg: #0b0b0f;
    --panel: #101017;
    --panel-2: #15151d;
    --border: #20202c;
    --border-soft: #191922;
    --text: #e7e7f0;
    --muted: #8b8ba1;
    --accent: #6c8cff;
    --accent-2: #a78bfa;
    --accent-soft: rgba(108, 140, 255, .12);
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  html[data-theme="light"] {
    --bg: #fbfbfd;
    --panel: #ffffff;
    --panel-2: #f7f7fa;
    --border: #e8e8ef;
    --border-soft: #f0f0f4;
    --text: #17171f;
    --muted: #74748a;
    --accent: #4b5bd7;
    --accent-2: #7c5cf0;
    --accent-soft: rgba(75, 91, 215, .08);
    --ok: #16a34a;
    --warn: #b45309;
    --err: #dc2626;
    --shadow: 0 1px 2px rgba(16, 16, 32, .06);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .i-sm { width: 13px; height: 13px; }

  /* ---------------- top bar ---------------- */
  header.topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 14px;
    height: 50px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }

  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark { width: 26px; height: 26px; }
  .brand .name { font-weight: 620; letter-spacing: -.2px; }
  .brand .ver { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 3px 5px; }

  .conn { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; min-width: 0; }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .conn .dot.up { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .conn .dot.down { background: var(--err); }
  .conn .model { color: var(--text); font-family: var(--mono); font-size: 12px; }
  .conn .sess { font-family: var(--mono); font-size: 11.5px; opacity: .8; }
  .conn .phase {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 11px; letter-spacing: .02em; color: var(--muted);
    padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px;
    max-width: 210px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .conn .phase::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: currentColor; opacity: .45;
  }
  .conn .phase.busy { color: var(--accent); }
  .conn .phase.think { color: var(--accent-2); }
  .conn .phase.wait { color: var(--warn); }
  .conn .phase.err { color: var(--err); }
  .conn .phase.busy::before,
  .conn .phase.think::before,
  .conn .phase.wait::before { animation: pulse-dot 1.1s ease-in-out infinite; }

  @keyframes pulse-dot {
    0%, 100% { opacity: .28; transform: scale(.75); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dots i {
    width: 4px; height: 4px; border-radius: 50%; background: currentColor;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .16s; }
  .dots i:nth-child(3) { animation-delay: .32s; }

  .spacer { flex: 1; }

  .opts { display: flex; align-items: center; gap: 6px; }

  .opt {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted);
    padding: 5px 9px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .opt:hover { background: var(--panel-2); color: var(--text); }
  .opt input { accent-color: var(--accent); margin: 0; width: 13px; height: 13px; }
  .opt.on { color: var(--text); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 9px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: background .12s, color .12s, border-color .12s;
  }
  .btn:hover { background: var(--panel-2); color: var(--text); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn.icon { padding: 6px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn[disabled] { opacity: .45; cursor: default; }

  /* ---------------- split layout ---------------- */
  main.split {
    flex: 1; display: flex; min-height: 0;
  }

  section.chat {
    flex: 1; min-width: 280px; display: flex; flex-direction: column; min-height: 0;
  }

  .gutter {
    width: 5px; cursor: col-resize; background: transparent; flex: none; position: relative;
  }
  .gutter::after {
    content: ''; position: absolute; inset: 0 2px; background: var(--border); opacity: 0; transition: opacity .15s;
  }
  .gutter:hover::after, .gutter.dragging::after { opacity: 1; }

  aside.workspace {
    width: var(--ws-width, 380px); min-width: 220px; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--panel); min-height: 0;
    transition: width .16s ease, min-width .16s ease;
  }
  /* collapsed: a 46px rail keeps the sidebar one click away */
  aside.workspace.collapsed { width: 46px; min-width: 46px; }
  aside.workspace.collapsed #tree,
  aside.workspace.collapsed #viewer,
  aside.workspace.collapsed .ws-head .count,
  aside.workspace.collapsed .ws-head #refreshFiles { display: none; }
  aside.workspace.collapsed .ws-head {
    flex-direction: column; align-items: center; height: 100%;
    padding: 10px 0; gap: 10px; border-bottom: 0;
  }
  aside.workspace.collapsed .ws-head .ws-label {
    writing-mode: vertical-rl; text-orientation: mixed; rotate: 180deg;
    letter-spacing: .16em; font-size: 10.5px; line-height: 1;
  }
  aside.workspace.collapsed #collapseWs svg { transform: rotate(180deg); }
  .ws-head .ws-label { transition: none; }
  main.split.ws-collapsed .gutter { display: none; }
  .mobile-only { display: none; }

  /* ---------------- transcript ---------------- */
  #transcript {
    flex: 1; overflow-y: auto; padding: 18px 18px 8px; scroll-behavior: smooth;
  }

  .msg { margin-bottom: 18px; max-width: 880px; }
  .msg .who {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 5px; display: flex; align-items: center; gap: 7px;
  }
  .msg.user .who { color: var(--accent); }
  .msg.user .body {
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: 12px 12px 12px 4px; padding: 9px 13px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .body > * + * { margin-top: 9px; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .text:empty { display: none; }

  .empty-note { color: var(--muted); font-size: 12.5px; font-style: italic; }

  /* thinking */
  details.think { border-left: 2px solid var(--border); padding-left: 11px; }
  details.think > summary {
    cursor: pointer; color: var(--muted); font-size: 12px; list-style: none;
    display: flex; align-items: center; gap: 6px; user-select: none;
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before {
    content: ''; width: 0; height: 0; border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
    transition: transform .15s;
  }
  details.think[open] > summary::before { transform: rotate(90deg); }
  .think-body { color: var(--muted); font-size: 12.5px; white-space: pre-wrap; margin-top: 6px; }
  details.think.is-live { border-left-color: var(--accent-2); }
  details.think.is-live > summary { color: var(--text); }
  details.think > summary .meta {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    opacity: .85; margin-left: 2px;
  }
  details.think.is-live .think-body::after {
    content: '▍'; margin-left: 1px; color: var(--accent-2);
    animation: caret 1s steps(2, start) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* tool cards */
  details.card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); overflow: hidden;
  }
  details.card > summary {
    cursor: pointer; list-style: none; padding: 8px 11px; display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; user-select: none;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary .name { font-family: var(--mono); color: var(--text); }
  details.card > summary .args { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.card > summary .state { margin-left: auto; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--border-soft); color: var(--muted); flex: none; }
  details.card > summary .state.ok { color: var(--ok); }
  details.card > summary .state.err { color: var(--err); }
  details.card > summary .state.denied { color: var(--warn); }
  .card-body { border-top: 1px solid var(--border); padding: 9px 11px; }

  pre.code {
    margin: 0; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word;
    color: var(--text); max-height: 320px; overflow: auto;
  }
  pre.code.dim { color: var(--muted); }

  /* proposals */
  .proposal { border: 1px solid var(--warn); border-radius: 10px; background: var(--panel-2); overflow: hidden; }
  .proposal.risk-low { border-color: var(--accent); }
  .proposal.risk-medium { border-color: var(--warn); }
  .proposal.risk-high { border-color: var(--err); }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 8px 11px; font-size: 12.5px; }
  .p-head .name { font-family: var(--mono); }
  .p-head .risk { margin-left: auto; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .p-body { border-top: 1px solid var(--border); padding: 9px 11px; }
  .p-actions { display: flex; gap: 7px; padding: 9px 11px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .proposal .status { font-size: 12px; color: var(--muted); padding: 9px 11px; border-top: 1px solid var(--border); }
  .proposal .countdown {
    font-family: var(--mono); font-size: 10.5px; color: var(--warn);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
  }
  .proposal .countdown.low { color: var(--err); border-color: var(--err); }
  .proposal .p-actions .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .proposal.expired { border-color: var(--border); opacity: .75; }
  .proposal .status.ok { color: var(--ok); }
  .proposal .status.denied { color: var(--warn); }
  .proposal .status.err { color: var(--err); }

  /* waiting pill */
  .wait {
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--muted); font-size: 12.5px;
  }
  .wait .spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wait .timer { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .wait .hint { color: var(--warn); font-size: 12px; }
  .wait.stalled { color: var(--err); }
  .wait.stalled .spin { border-top-color: var(--err); animation-duration: 2.4s; }

  .line { font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .line.err { color: var(--err); }
  .line.warn { color: var(--warn); }

  /* ---------------- composer ---------------- */
  form.composer {
    flex: none; display: flex; gap: 9px; padding: 11px 18px 15px; align-items: flex-end;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #message {
    flex: 1; resize: none; min-height: 42px; max-height: 190px; padding: 10px 12px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 11px; font: inherit; outline: none;
  }
  #message:focus { border-color: var(--accent); }
  #message::placeholder { color: var(--muted); }

  /* ---------------- workspace ---------------- */
  .ws-head, .drawer-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); flex: none;
  }
  .ws-head .count { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: var(--mono); }

  #tree { flex: 1 1 45%; overflow: auto; padding: 7px 6px; min-height: 90px; }
  .tnode { display: flex; align-items: center; gap: 6px; padding: 2.5px 7px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .tnode:hover { background: var(--panel-2); color: var(--text); }
  .tnode.dir { color: var(--text); }
  .tnode.sel { background: var(--accent-soft); color: var(--accent); }
  .tnode .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnode .fresh { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); margin-left: auto; flex: none; }
  .tnode .chev { transition: transform .15s; }
  .tnode .chev.open { transform: rotate(90deg); }

  #viewer { flex: 1 1 55%; display: flex; flex-direction: column; border-top: 1px solid var(--border); min-height: 0; }
  .v-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
    font: 11.5px/1.4 var(--mono); color: var(--muted); flex: none;
  }
  .v-head .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .badge { border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; font: 10px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; flex: none; }
  #fileBody { flex: 1; overflow: auto; padding: 11px 12px; margin: 0; font: 12px/1.55 var(--mono); white-space: pre; }
  #fileBody.placeholder { color: var(--muted); white-space: pre-wrap; font-family: var(--sans); }

  /* ---------------- events drawer ---------------- */
  section.drawer {
    flex: none; height: 190px; display: flex; flex-direction: column;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  section.drawer[hidden] { display: none; }
  #eventsView { flex: 1; overflow: auto; padding: 6px 0; font: 11.5px/1.5 var(--mono); }
  .ev { display: flex; gap: 9px; padding: 2px 12px; }
  .ev .t { color: var(--muted); flex: none; }
  .ev .k { width: 96px; flex: none; color: var(--accent); }
  .ev .m { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.error .k, .ev.error .m { color: var(--err); }
  .ev.warning .k, .ev.warning .m { color: var(--warn); }
  .ev.done .k { color: var(--ok); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* the events drawer can be dragged taller */
  #drawer { position: relative; }
  .drawer-grip {
    position: absolute; left: 0; right: 0; top: -3px; height: 7px;
    cursor: row-resize; z-index: 5;
  }
  .drawer-grip::after {
    content: ''; position: absolute; left: 50%; top: 2px; width: 42px; height: 3px;
    margin-left: -21px; border-radius: 3px; background: var(--border); opacity: 0; transition: opacity .15s;
  }
  #drawer:hover .drawer-grip::after, .drawer-grip.dragging::after { opacity: 1; }
  .drawer-head .btn.icon { padding: 4px; }

  @media (max-width: 850px) {
    /* sidebars become overlays instead of disappearing */
    .gutter { display: none; }
    .mobile-only { display: inline-flex; }
    aside.workspace {
      position: fixed; top: 50px; right: 0; bottom: 0; z-index: 40;
      width: min(88vw, 400px); min-width: 0;
      transform: translateX(101%); transition: transform .18s ease;
      box-shadow: -24px 0 48px rgba(0, 0, 0, .45);
    }
    aside.workspace.collapsed { width: min(88vw, 400px); min-width: 0; }
    aside.workspace.collapsed #tree,
    aside.workspace.collapsed #viewer { display: flex; }
    aside.workspace.collapsed #tree { display: block; }
    aside.workspace.collapsed .ws-head .count,
    aside.workspace.collapsed .ws-head #refreshFiles { display: inline-flex; }
    aside.workspace.collapsed .ws-head {
      flex-direction: row; align-items: center; height: auto; padding: 9px 12px; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    aside.workspace.collapsed .ws-head .ws-label {
      writing-mode: initial; rotate: none; letter-spacing: .07em; font-size: 11px;
    }
    aside.workspace.collapsed #collapseWs svg { transform: none; }
    body.ws-open aside.workspace { transform: none; }
    body.ws-open::after {
      content: ''; position: fixed; inset: 50px 0 0 0; z-index: 35;
      background: rgba(0, 0, 0, .45);
    }
    #drawer { height: 34vh !important; }
  }
</style>
</head>

</svg>

<header class="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--accent)" />
          <stop offset="1" stop-color="var(--accent-2)" />
        </linearGradient>
      </defs>
      <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="9" fill="url(#brandGrad)" opacity=".14" />
      <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="9" fill="none" stroke="url(#brandGrad)" stroke-width="1.7" />
      <path d="M10.5 22V10l11 12V10" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span class="name">nour-code</span>

  <div class="conn">

    </label>
    <label class="opt on" title="Show the model's reasoning">

    </label>
    <button class="btn icon mobile-only" id="wsBtn" title="Files and workspace">
      <svg class="i"><use href="#i-panel" /></svg>
    </button>
    <button class="btn icon" id="streamBtn" title="Raw event stream">
      <svg class="i"><use href="#i-stream" /></svg>
    </button>
    <button class="btn icon" id="themeBtn" title="Toggle theme">
      <svg class="i"><use href="#i-moon" id="themeIcon" /></svg>
    </button>
    <button class="btn" id="newSession" title="Start a new session">
      <svg class="i i-sm"><use href="#i-plus" /></svg> new
    </button>

</header>

<main class="split">
  <section class="chat">
    <div id="transcript"></div>
    <form class="composer" id="composer">
      <textarea id="message" rows="1" placeholder="Ask nour-code to build, fix or explain something…"></textarea>
      <button class="btn primary icon" id="send" type="submit" title="Send (Ctrl+Enter)">

        <svg class="i"><use href="#i-stop" /></svg>
      </button>
    </form>
  </section>

  <div class="gutter" id="gutter"></div>

  <aside class="workspace">
    <div class="ws-head">
      <svg class="i i-sm"><use href="#i-folder" /></svg>
      <span class="ws-label">workspace</span>

        <svg class="i i-sm"><use href="#i-refresh" /></svg>

        <svg class="i i-sm"><use href="#i-panel" /></svg>
      </button>

        <svg class="i i-sm"><use href="#i-file" /></svg>

          <svg class="i i-sm"><use href="#i-copy" /></svg>
        </button>

      <pre id="fileBody" class="placeholder">Pick a file on the left to read it.
Nothing here can be edited — the viewer is read-only by design.</pre>
    </div>
  </aside>
</main>

<section class="drawer" id="drawer" hidden>
  <div class="drawer-grip" id="drawerGrip" title="Drag to resize"></div>
  <div class="drawer-head">
    <svg class="i i-sm"><use href="#i-stream" /></svg>
    <span>stream</span>
    <span class="spacer"></span>
    <span id="stats"></span>
    <button class="btn" id="clearEvents">clear</button>
    <button class="btn icon" id="hideEvents" title="Collapse the stream">
      <svg class="i i-sm"><use href="#i-chev" /></svg>
    </button>
  </div>
  <div id="eventsView"></div>
</section>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const icon = (name, cls) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  };

  const state = {
    sessionId: localStorage.getItem('nour-code-session') || null,
    controller: null,
    events: 0,
    toolIds: new Set(),
    proposals: new Map(),
    usage: { total_tokens: 0 },
    files: [],
    selected: null,
    theme: localStorage.getItem('nour.ui.theme') || 'dark',
    showThinking: localStorage.getItem('nour.ui.showThinking') !== '0',
    startedAt: null,
    ticker: null,
    waitStart: null,
    turn: null,
    busy: false,
    lastByteAt: 0,
    watchdog: null,
    watchdogFired: null,
    stallNoted: false,
    phaseAfterTurn: null,
    collapseTimers: [],
  };

  /* ---------------- status chip ---------------- */
  function setPhase(label, kind) {
    const chip = $('phase');
    chip.textContent = label;
    chip.className = 'phase' + (kind ? ' ' + kind : '');
  }


  /* ---------------- theme ---------------- */
  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    $('themeIcon').setAttribute('href', state.theme === 'dark' ? '#i-moon' : '#i-sun');
    localStorage.setItem('nour.ui.theme', state.theme);
  }
  $('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  });

  /* ---------------- option toggles ---------------- */
  const syncOpts = () => {
    $('approve').closest('.opt').classList.toggle('on', $('approve').checked);
    $('think').closest('.opt').classList.toggle('on', $('think').checked);
  };
  $('approve').addEventListener('change', syncOpts);
  $('think').addEventListener('change', () => {
    syncOpts();
    document.querySelectorAll('details.think').forEach((d) => { d.open = $('think').checked && d.dataset.auto !== '0'; });
  });

  /* ---------------- layout: collapsible panes ---------------- */
  (() => {
    const aside = document.querySelector('aside.workspace');
    const split = document.querySelector('main.split');
    const stored = Number(localStorage.getItem('nour.ui.wsWidth'));
    const wide = window.matchMedia('(min-width: 851px)');
    let dragging = false;

    const setWidth = (px) => {
      const w = Math.round(px);
      if (w > 220) aside.style.setProperty('--ws-width', w + 'px');
    };
    if (stored > 220) setWidth(stored);

    /* collapsed state survives a reload; on phones the aside is a drawer instead */
    const applyCollapsed = (collapsed) => {
      aside.classList.toggle('collapsed', collapsed && wide.matches);
      split.classList.toggle('ws-collapsed', collapsed && wide.matches);
      document.body.classList.remove('ws-open');
      $('collapseWs').title = collapsed
        ? 'Expand the sidebar (Ctrl+B)'
        : 'Collapse the sidebar (Ctrl+B)';
      if (wide.matches) localStorage.setItem('nour.ui.wsCollapsed', collapsed ? '1' : '0');
    };
    applyCollapsed(localStorage.getItem('nour.ui.wsCollapsed') === '1');

    $('collapseWs').addEventListener('click', () => {
      if (!wide.matches) {
        document.body.classList.remove('ws-open');
        return;
      }
      applyCollapsed(!aside.classList.contains('collapsed'));
    });

    /* phones: the sidebar slides over the transcript; tapping the scrim closes it */
    $('wsBtn').addEventListener('click', () => document.body.classList.toggle('ws-open'));
    document.addEventListener('click', (event) => {
      if (!document.body.classList.contains('ws-open')) return;
      if (event.target.closest('aside.workspace') || event.target.closest('#wsBtn')) return;
      document.body.classList.remove('ws-open');
    });

    wide.addEventListener('change', () => {
      applyCollapsed(localStorage.getItem('nour.ui.wsCollapsed') === '1');
    });

    $('gutter').addEventListener('pointerdown', (event) => {
      if (aside.classList.contains('collapsed')) return;
      dragging = true;
      $('gutter').classList.add('dragging');
      $('gutter').setPointerCapture(event.pointerId);
    });
    $('gutter').addEventListener('pointermove', (event) => {
      if (!dragging) return;
      setWidth(Math.max(220, Math.min(window.innerWidth - 320, window.innerWidth - event.clientX)));
    });
    $('gutter').addEventListener('pointerup', (event) => {
      dragging = false;
      $('gutter').classList.remove('dragging');
      localStorage.setItem(
        'nour.ui.wsWidth',
        String(Math.round(aside.getBoundingClientRect().width)),
      );
      if (event.pointerId !== undefined && $('gutter').hasPointerCapture(event.pointerId)) {
        $('gutter').releasePointerCapture(event.pointerId);
      }
    });

    /* the raw-event drawer can be dragged taller, and remembers its height */
    const drawer = $('drawer');
    const grip = $('drawerGrip');
    const savedHeight = Number(localStorage.getItem('nour.ui.drawerHeight'));
    if (savedHeight > 80) drawer.style.height = Math.min(savedHeight, window.innerHeight - 220) + 'px';
    let lifting = false;
    grip.addEventListener('pointerdown', (event) => {
      lifting = true;
      grip.classList.add('dragging');
      grip.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    grip.addEventListener('pointermove', (event) => {
      if (!lifting) return;
      const next = Math.max(80, Math.min(window.innerHeight - 220, window.innerHeight - event.clientY));
      drawer.style.height = next + 'px';
    });
    const drop = (event) => {
      if (!lifting) return;
      lifting = false;
      grip.classList.remove('dragging');
      localStorage.setItem('nour.ui.drawerHeight', String(Math.round(drawer.getBoundingClientRect().height)));
      if (event.pointerId !== undefined && grip.hasPointerCapture(event.pointerId)) {
        grip.releasePointerCapture(event.pointerId);
      }
    };
    grip.addEventListener('pointerup', drop);
    grip.addEventListener('pointercancel', drop);
  })();

  /* ---------------- event log ---------------- */
  function pushEvent(kind, data) {
    state.events += 1;
    const row = el('div', 'ev ' + kind);
    const time = new Date((data.ts || Date.now() / 1000) * 1000).toLocaleTimeString([], { hour12: false });
    row.appendChild(el('span', 't', time));
    row.appendChild(el('span', 'k', kind));
    row.appendChild(el('span', 'm', summarize(kind, data)));
    const view = $('eventsView');
    view.appendChild(row);
    view.scrollTop = view.scrollHeight;
    updateStats();
  }

  function summarize(kind, data) {
    switch (kind) {
      case 'thinking': return (data.text || '').slice(0, 90);
      case 'token': return JSON.stringify(data.text || '');
      case 'tool_call': return data.tool + ' ' + shortArgs(data.arguments);
      case 'tool_result': return `${data.tool} ${data.status}${data.error ? ' — ' + data.error : ''}`;
      case 'tool_proposal': return `${data.tool} needs approval (${data.risk})`;
      case 'status': {
        if (data.phase === 'model_call') return `calling ${data.model} — iteration ${data.iteration}`;
        if (data.phase === 'waiting') return `no token yet — ${Math.round((data.waited_ms || 0) / 1000)}s`;
        if (data.phase === 'model_streaming') return `first token after ${Math.round(data.wait_ms)} ms`;
        if (data.phase === 'queued') return data.message || 'queued behind another turn';
        return data.phase;
      }
      case 'usage': return `${data.total_tokens} tokens (iteration ${data.iteration})`;
      case 'file_change': return `${data.action} ${data.path}`;
      case 'verification': return `${data.command} → exit ${data.exit_code}`;
      case 'skill_loaded': return `${data.name}: ${(data.tools || []).join(', ')}`;
      case 'warning': return data.message || '';
      case 'error': return `${data.code || 'error'}: ${data.message || ''}`;
      case 'done': return `finished in ${Math.round(data.response?.duration_ms || 0)} ms`;
      default: return JSON.stringify(data).slice(0, 120);
    }
  }

  const shortArgs = (args) => {
    if (!args) return '';
    const text = typeof args === 'string' ? args : JSON.stringify(args);
    return text.length > 70 ? text.slice(0, 70) + '…' : text;
  };

  function updateStats() {
    const seconds = state.startedAt ? ((Date.now() - state.startedAt) / 1000).toFixed(1) : '0.0';
    const tokens = state.usage.total_tokens ? ` · ${state.usage.total_tokens} tok` : '';
    $('stats').textContent = `${state.events} events · ${state.toolIds.size} tools · ${seconds}s${tokens}`;
  }

  /* ---------------- turn scaffolding ---------------- */
  function newTurn(message) {
    const wrap = el('div', 'msg assistant');
    const who = el('div', 'who');
    who.textContent = 'nour-code';
    const body = el('div', 'body');
    const cards = el('div', 'cards');
    const text = el('div', 'text');
    body.append(cards, text);
    wrap.append(who, body);
    $('transcript').appendChild(wrap);
    $('transcript').scrollTop = $('transcript').scrollHeight;

    if (message) {
      const mine = el('div', 'msg user');
      const mineWho = el('div', 'who');
      mineWho.textContent = 'you';
      mine.append(mineWho, el('div', 'body', message));
      $('transcript').insertBefore(mine, wrap);
    }

    state.turn = {
      wrap, cards, text, thinking: null, waiting: null,
      empty: true, stopped: false, waitHint: false, waitLabel: null,
    };
    return state.turn;
  }

  function scrollDown() {
    const view = $('transcript');
    view.scrollTop = view.scrollHeight;
  }

  /* ---------------- rendering ---------------- */
  function renderThinking(data) {
    const turn = state.turn;
    if (!turn) return;
    const iteration = data.iteration || 1;
    if (!turn.thinkBlocks) turn.thinkBlocks = new Map();

    let block = turn.thinkBlocks.get(iteration);
    if (!block) {
      const details = el('details', 'think is-live');
      const summary = el('summary');
      summary.appendChild(
        el('span', null, iteration > 1 ? `thinking · iteration ${iteration}` : 'thinking'),
      );
      const dots = el('span', 'dots');
      dots.append(el('i'), el('i'), el('i'));
      const meta = el('span', 'meta', '0 chars');
      summary.append(dots, meta);
      const body = el('div', 'think-body');
      details.append(summary, body);
      details.open = state.showThinking && $('think').checked;
      turn.cards.parentElement.insertBefore(details, turn.cards);
      block = { details, body, meta, dots, started: performance.now(), chars: 0 };
      turn.thinkBlocks.set(iteration, block);
    }

    const text = data.text || '';
    block.chars += text.length;
    block.body.textContent += text;
    block.meta.textContent =
      `${block.chars} chars · ${((performance.now() - block.started) / 1000).toFixed(1)}s`;
    setPhase('thinking', 'think');
    scrollDown();
  }

  /** The model stopped reasoning: freeze the counters, drop the pulsing dots. */
  function closeThinking(turn) {
    if (!turn || !turn.thinkBlocks) return;
    for (const block of turn.thinkBlocks.values()) {
      if (!block.dots) continue;
      block.dots.remove();
      block.dots = null;
      block.details.classList.remove('is-live');
      const seconds = ((performance.now() - block.started) / 1000).toFixed(1);
      block.meta.textContent = `${block.chars} chars · ${seconds}s`;
    }
  }

  function renderToolCall(data) {
    const turn = state.turn;
    if (!turn) return;
    state.toolIds.add(data.id);
    const card = el('details', 'card');
    card.dataset.toolId = data.id;
    const summary = el('summary');
    summary.appendChild(icon('chev', 'i-sm'));
    summary.appendChild(el('span', 'name', data.tool));
    summary.appendChild(el('span', 'args', shortArgs(data.arguments)));
    const pill = el('span', 'state', 'running');
    summary.appendChild(pill);
    const body = el('div', 'card-body');
    card.append(summary, body);
    turn.cards.appendChild(card);
    turn.empty = false;
    scrollDown();
  }

  function renderToolResult(data) {
    state.toolIds.add(data.id);
    const card = document.querySelector(`details.card[data-tool-id="${data.id}"]`);
    if (!card) return;
    const pill = card.querySelector('.state');
    const label = data.timed_out ? 'timed out' : data.rejected ? 'rejected' : data.status;
    pill.textContent = label;
    pill.className =
      'state ' +
      (data.timed_out || data.rejected || data.status === 'denied'
        ? 'denied'
        : data.status === 'ok'
          ? 'ok'
          : 'err');
    const body = card.querySelector('.card-body');
    body.textContent = '';
    const payload = data.error ? data.error : (typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2));
    body.appendChild(el('pre', 'code', String(payload || '').slice(0, 8000)));
    card.open = data.status !== 'ok' || data.rejected;
    scrollDown();
  }

  function renderProposal(data) {
    const turn = state.turn;
    if (!turn) return;
    state.proposals.set(data.id, data);

    const box = el('div', 'proposal risk-' + (data.risk || 'low'));
    box.dataset.proposalId = data.id;

    const head = el('div', 'p-head');
    head.appendChild(icon('file', 'i-sm'));
    head.appendChild(el('span', 'name', data.tool));
    head.appendChild(el('span', 'risk', (data.risk || 'low') + ' risk'));
    const countdown = el('span', 'countdown', '');
    head.appendChild(countdown);
    box.appendChild(head);

    const body = el('div', 'p-body');
    body.appendChild(el('pre', 'code', JSON.stringify(data.arguments, null, 2).slice(0, 4000)));
    box.appendChild(body);

    const actions = el('div', 'p-actions');
    const approve = el('button', 'btn primary', 'approve');
    const reject = el('button', 'btn', 'reject');
    const approveAll = el('button', 'btn', 'approve all');
    const rejectAll = el('button', 'btn', 'reject all');
    actions.append(approve, reject, approveAll, rejectAll);
    box.appendChild(actions);

    const timeout = Number(data.timeout_seconds) || 0;
    const expiresAt = timeout ? Date.now() + timeout * 1000 : 0;

    const setStatus = (text, kind) => {
      let status = box.querySelector('.status');
      if (!status) {
        status = el('div', 'status');
        box.appendChild(status);
      }
      status.textContent = text;
      status.className = 'status' + (kind ? ' ' + kind : '');
      box.classList.toggle('expired', kind === 'denied' || kind === 'err');
    };

    const stopTicking = () => {
      if (box._timer) {
        clearInterval(box._timer);
        box._timer = null;
      }
    };

    const expire = (text) => {
      stopTicking();
      actions.remove();
      countdown.remove();
      setStatus(text, 'denied');
    };

    const tick = () => {
      if (!expiresAt) {
        countdown.remove();
        return;
      }
      const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
      const minutes = Math.floor(left / 60);
      const seconds = String(left % 60).padStart(2, '0');
      countdown.textContent = `${minutes}:${seconds}`;
      countdown.classList.toggle('low', left <= 30);
      if (left <= 0) expire('timed out — nothing ran');
    };
    if (expiresAt) {
      tick();
      box._timer = setInterval(tick, 1000);
    } else {
      countdown.remove();
    }

    const decide = (decision, withId) => {
      stopTicking();
      actions.remove();
      countdown.remove();
      setStatus(decision.startsWith('approve') ? 'approved — running…' : 'rejected');
      const payload = { decision };
      if (withId) payload.proposal_id = data.id;
      fetch(`/sessions/${state.sessionId}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(async (response) => {
          if (response.ok) return;
          const detail = (await response.text().catch(() => '')).slice(0, 300);
          let message = `the server refused this decision (HTTP ${response.status})`;
          if (response.status === 404) {
            message = 'this proposal expired — the turn is no longer waiting';
          } else if (response.status === 400) {
            message = 'this card sent no proposal id — reload the page';
          }
          setStatus(message, 'err');
          setPhase('approval failed', 'err');
          pushEvent('warning', {
            code: 'approval_failed',
            message: `${message}${detail ? ' — ' + detail : ''}`,
            ts: Date.now() / 1000,
          });
        })
        .catch((err) => {
          setStatus(`network error — ${err.message || err}`, 'err');
          setPhase('approval failed', 'err');
          pushEvent('error', {
            code: 'approval_failed',
            message: String(err),
            ts: Date.now() / 1000,
          });
        });
    };

    approve.addEventListener('click', () => decide('approve', true));
    reject.addEventListener('click', () => decide('reject', true));
    approveAll.addEventListener('click', () => decide('approve_all', false));
    rejectAll.addEventListener('click', () => decide('reject_all', false));

    turn.cards.appendChild(box);
    turn.empty = false;
    setPhase('waiting for approval', 'wait');
    scrollDown();
  }

  function resolveProposal(data) {
    let entry = data.proposal_id ? [data.proposal_id, state.proposals.get(data.proposal_id)] : null;
    if (!entry || !entry[1]) {
      // older servers do not echo proposal_id; fall back to the tool name
      for (const candidate of state.proposals) {
        if (candidate[1].tool === data.tool) {
          entry = candidate;
          break;
        }
      }
    }
    if (!entry || !entry[1]) return;
    const [id] = entry;
    state.proposals.delete(id);
    const box = document.querySelector(`.proposal[data-proposal-id="${id}"]`);
    if (!box) return;
    if (box._timer) {
      clearInterval(box._timer);
      box._timer = null;
    }
    box.querySelector('.p-actions')?.remove();
    box.querySelector('.countdown')?.remove();
    let status = box.querySelector('.status');
    if (!status) {
      status = el('div', 'status');
      box.appendChild(status);
    }
    if (data.timed_out) {
      status.textContent = 'timed out — nothing ran';
      status.className = 'status denied';
      box.classList.add('expired');
    } else if (data.rejected) {
      status.textContent = 'rejected — nothing ran';
      status.className = 'status denied';
      box.classList.add('expired');
    } else if (data.status === 'ok') {
      status.textContent = `executed in ${Math.round(data.duration_ms || 0)} ms`;
      status.className = 'status ok';
    } else {
      status.textContent = `failed — ${data.error || data.status}`;
      status.className = 'status err';
      box.classList.add('expired');
    }
  }

  function renderVerification(data) {
    const turn = state.turn;
    if (!turn) return;
    const card = el('details', 'card');
    card.open = data.exit_code !== 0;
    const summary = el('summary');
    summary.appendChild(icon('check', 'i-sm'));
    summary.appendChild(el('span', 'name', 'verification'));
    summary.appendChild(el('span', 'args', data.command));
    const pill = el('span', 'state ' + (data.exit_code === 0 ? 'ok' : 'err'), 'exit ' + data.exit_code);
    summary.appendChild(pill);
    const body = el('div', 'card-body');
    body.appendChild(el('pre', 'code', String(data.output || '').slice(0, 6000)));
    card.append(summary, body);
    turn.cards.appendChild(card);
    turn.empty = false;
  }

  function fmtElapsed(ms) {
    const seconds = ms / 1000;
    if (seconds < 60) return seconds.toFixed(1) + 's';
    const minutes = Math.floor(seconds / 60);
    return `${minutes}m ${String(Math.floor(seconds % 60)).padStart(2, '0')}s`;
  }

  function ensureTicker() {
    if (state.ticker) return;
    state.ticker = setInterval(() => {
      const turn = state.turn;
      if (turn && turn.waiting && state.waitStart) {
        if (turn.waitTimer) turn.waitTimer.textContent = fmtElapsed(performance.now() - state.waitStart);
      }
      updateStats();
    }, 100);
  }

  /** One spinner, one label, one elapsed clock — reused by every waiting phase. */
  function showWait(turn, label, kind) {
    if (!turn) return;
    if (!turn.waiting) {
      const wait = el('div', 'wait');
      wait.appendChild(el('span', 'spin'));
      const text = el('span', 'label', label);
      const timer = el('span', 'timer', '0.0s');
      wait.append(text, timer);
      turn.cards.parentElement.insertBefore(wait, turn.cards);
      turn.waiting = wait;
      turn.waitLabel = text;
      turn.waitTimer = timer;
      state.waitStart = performance.now();
    } else if (turn.waitLabel) {
      turn.waitLabel.textContent = label;
    }
    if (turn.waiting) turn.waiting.classList.toggle('stalled', kind === 'stalled');
    ensureTicker();
    scrollDown();
  }

  function removeWait(turn) {
    if (!turn || !turn.waiting) return;
    turn.waiting.remove();
    turn.waiting = null;
    turn.waitLabel = null;
    turn.waitTimer = null;
    state.waitStart = null;
  }

  function renderStatus(data) {
    const turn = state.turn;
    if (!turn) return;
    switch (data.phase) {
      case 'queued':
        showWait(turn, data.message || 'another turn is still running in this session', 'wait');
        setPhase('queued', 'wait');
        break;
      case 'turn_started':
        removeWait(turn);
        setPhase('starting', 'busy');
        break;
      case 'model_call':
        showWait(
          turn,
          `thinking with ${data.model || 'the model'} · iteration ${data.iteration || 1}`,
          'think',
        );
        setPhase('thinking', 'think');
        break;
      case 'waiting': {
        // Every few seconds while the model is silent — usually a cold load of
        // ~6 GB of weights. The clock keeps counting; after 8 s say what it is.
        const seconds = Math.round((data.waited_ms || 0) / 1000);
        showWait(turn, 'loading the model into memory', 'busy');
        // continue counting from the server's elapsed time, not from this frame
        if (data.waited_ms) state.waitStart = performance.now() - data.waited_ms;
        if (turn.waitTimer) turn.waitTimer.textContent = fmtElapsed(data.waited_ms || 0);
        if (seconds >= 8 && !turn.waitHint) {
          turn.waitHint = true;
          turn.waiting?.appendChild(
            el('span', 'hint', 'the first call after a cold start can take a minute'),
          );
        }
        setPhase(`loading model · ${seconds}s`, 'wait');
        break;
      }
      case 'model_streaming':
        removeWait(turn);
        setPhase('streaming', 'busy');
        break;
      default:
        break;
    }
  }

  function renderWarning(data) {
    const turn = state.turn;
    if (!turn) return;
    const line = el('div', 'line warn');
    line.appendChild(icon('alert', 'i-sm'));
    line.appendChild(el('span', null, data.message || JSON.stringify(data)));
    turn.cards.appendChild(line);
    turn.empty = false;
  }

  function renderError(data) {
    const turn = state.turn;
    if (!turn) return;
    const line = el('div', 'line err');
    line.appendChild(icon('x', 'i-sm'));
    line.appendChild(el('span', null, (data.message || data.code || 'error')));
    turn.cards.appendChild(line);
    turn.empty = false;
  }

  /* ---------------- routing ---------------- */
  function handleEvent(type, data) {
    pushEvent(type, data);
    switch (type) {
      case 'thinking':
        if (state.turn) removeWait(state.turn);
        renderThinking(data);
        break;
      case 'token':
        if (state.turn) {
          closeThinking(state.turn);
          state.turn.text.textContent += data.text || '';
          state.turn.empty = false;
          setPhase('streaming', 'busy');
          scrollDown();
        }
        break;
      case 'status':
        renderStatus(data);
        break;
      case 'tool_call':
        if (state.turn) {
          removeWait(state.turn);
          closeThinking(state.turn);
        }
        renderToolCall(data);
        setPhase(`running ${data.tool || 'a tool'}`, 'busy');
        break;
      case 'tool_result':
        if (state.turn) removeWait(state.turn);
        renderToolResult(data);
        resolveProposal(data);
        setPhase(data.status === 'ok' ? 'continuing' : 'continuing after an error', 'busy');
        break;
      case 'tool_proposal':
        if (state.turn) {
          removeWait(state.turn);
          closeThinking(state.turn);
        }
        renderProposal(data);
        break;
      case 'usage':
        state.usage = data;
        updateStats();
        break;
      case 'verification':
        renderVerification(data);
        break;
      case 'file_change':
        markFresh(data.path);
        break;
      case 'warning':
        renderWarning(data);
        break;
      case 'error':
        renderError(data);
        state.phaseAfterTurn = 'error';
        setPhase('error', 'err');
        break;
      case 'done':
        finishTurn(data);
        break;
      default:
        break;
    }
  }

  function finishTurn(data) {
    const turn = state.turn;
    if (turn) {
      closeThinking(turn);
      removeWait(turn);
      if (turn.empty) {
        turn.text.appendChild(el('span', 'empty-note', '(no text returned — check the thinking block and the stream)'));
      }
      if (data && data.response && data.response.warnings && data.response.warnings.length) {
        data.response.warnings.forEach((warning) => {
          const line = el('div', 'line warn');
          line.appendChild(icon('alert', 'i-sm'));
          line.appendChild(el('span', null, warning));
          turn.cards.appendChild(line);
        });
      }
    }
    // Any card still on screen belongs to a turn that is over: its buttons
    // would post to a gate that no longer exists.
    for (const [id, proposal] of [...state.proposals]) {
      state.proposals.delete(id);
      const box = document.querySelector(`.proposal[data-proposal-id="${id}"]`);
      if (!box) continue;
      if (box._timer) {
        clearInterval(box._timer);
        box._timer = null;
      }
      box.querySelector('.p-actions')?.remove();
      box.querySelector('.countdown')?.remove();
      const status = box.querySelector('.status') || box.appendChild(el('div', 'status'));
      status.textContent = 'the turn ended before a decision';
      status.className = 'status denied';
      box.classList.add('expired');
    }
    state.turn = null;
    stopWatchdog();
    const lingering = state.phaseAfterTurn;
    setPhase(lingering || 'idle', lingering ? 'err' : undefined);
    state.phaseAfterTurn = null;
  }

  /* ---------------- send ---------------- */
  function startTimer() {
    state.startedAt = Date.now();
    ensureTicker();
    updateStats();
  }
  function stopTimer() {
    clearInterval(state.ticker);
    state.ticker = null;
    state.startedAt = null;
    updateStats();
  }
  function setBusy(busy) {
    state.busy = busy;
    $('stop').disabled = !busy;
    $('send').disabled = busy;
    if (!busy) stopWatchdog();
  }

  /* A dead connection is otherwise invisible: fetch() rejects, or worse, the
     read loop simply never yields again. Keepalives arrive every 15 s, so
     silence is meaningful. */
  function stopWatchdog() {
    if (state.watchdog) {
      clearInterval(state.watchdog);
      state.watchdog = null;
    }
  }

  function startWatchdog() {
    stopWatchdog();
    state.lastByteAt = Date.now();
    state.stallNoted = false;
    state.watchdogFired = null;
    state.watchdog = setInterval(() => {
      if (!state.busy) return;
      const idle = Date.now() - state.lastByteAt;
      if (idle > 90000) {
        state.watchdogFired =
          `the stream went silent for ${Math.round(idle / 1000)}s — ` +
          'the server may have restarted. Nothing else is coming; send the message again.';
        try {
          state.controller?.abort();
        } catch (err) {
          /* already aborted */
        }
        return;
      }
      if (idle > 45000 && !state.stallNoted) {
        state.stallNoted = true;
        setPhase('no data — still waiting', 'wait');
        const turn = state.turn;
        if (turn) {
          const line = el('div', 'line warn');
          line.appendChild(icon('alert', 'i-sm'));
          line.appendChild(
            el('span', null, `no data for ${Math.round(idle / 1000)}s — waiting for the server`),
          );
          turn.cards.appendChild(line);
          turn.stallLine = line;
          scrollDown();
        }
      }
    }, 1000);
  }

  function markStreamAlive() {
    state.lastByteAt = Date.now();
    if (!state.stallNoted) return;
    state.stallNoted = false;
    const turn = state.turn;
    if (turn && turn.stallLine) {
      turn.stallLine.remove();
      turn.stallLine = null;
    }
    setPhase('streaming', 'busy');
  }

  async function streamMessage() {
    const message = $('message').value.trim();
    if (!message) return;
    $('message').value = '';
    $('message').style.height = 'auto';
    newTurn(message);
    setBusy(true);
    startTimer();
    startWatchdog();
    setPhase('connecting', 'busy');
    state.controller = new AbortController();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          session_id: state.sessionId || null,
          production_ready: null,
          approval: $('approve').checked ? 'mutating' : 'off',
          enable_thinking: $('think').checked ? true : null,
        }),
        signal: state.controller.signal,
      });

      const header = response.headers.get('X-Session-Id');
      if (header) {
        state.sessionId = header;
        localStorage.setItem('nour-code-session', header);
        setSessionBadge();
      }

      if (!response.ok) {
        const detail = await response.text();
        handleEvent('error', { code: 'http_' + response.status, message: detail.slice(0, 800), ts: Date.now() / 1000 });
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        markStreamAlive();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let index = buffer.indexOf('\n\n');
        while (index !== -1) {
          const frame = buffer.slice(0, index);
          buffer = buffer.slice(index + 2);
          index = buffer.indexOf('\n\n');
          if (!frame.trim() || frame.startsWith(':')) continue;
          let type = null;
          const lines = [];
          frame.split('\n').forEach((line) => {
            if (line.startsWith('event:')) type = line.slice(6).trim();
            else if (line.startsWith('data:')) lines.push(line.slice(5).trim());
          });
          if (!type || !lines.length) continue;
          let data = {};
          try { data = JSON.parse(lines.join('\n')); }
          catch (err) { data = { raw: lines.join('\n'), parse_error: String(err) }; }
          handleEvent(type, data);
        }
      }
    } catch (err) {
      if (err && err.name === 'AbortError' && state.watchdogFired) {
        pushEvent('error', { code: 'stream_lost', message: state.watchdogFired, ts: Date.now() / 1000 });
        if (state.turn) {
          const line = el('div', 'line err');
          line.appendChild(icon('x', 'i-sm'));
          line.appendChild(el('span', null, state.watchdogFired));
          state.turn.cards.appendChild(line);
        }
        state.phaseAfterTurn = 'connection lost';
        setPhase('connection lost', 'err');
      } else if (err && err.name === 'AbortError') {
        pushEvent('warning', { message: 'stopped by user', ts: Date.now() / 1000 });
        if (state.turn) {
          state.turn.stopped = true;
          const note = el('span', 'empty-note');
          note.appendChild(icon('stop', 'i-sm'));
          note.appendChild(el('span', null, ' stopped'));
          state.turn.text.appendChild(note);
        }
        setPhase('stopped', 'wait');
      } else {
        const message = err && err.message ? `${err.name || 'Error'}: ${err.message}` : String(err);
        pushEvent('error', { code: 'client_error', message, ts: Date.now() / 1000 });
        if (state.turn) {
          const line = el('div', 'line err');
          line.appendChild(icon('x', 'i-sm'));
          line.appendChild(
            el(
              'span',
              null,
              `${message} — the connection dropped; the server may have restarted.`,
            ),
          );
          state.turn.cards.appendChild(line);
        }
        state.phaseAfterTurn = 'connection lost';
        setPhase('connection lost', 'err');
      }
    } finally {
      finishTurn(null);
      stopTimer();
      setBusy(false);
      state.controller = null;
      refreshFiles();
    }
  }

  /* ---------------- workspace ---------------- */
  async function refreshFiles() {
    try {
      const response = await fetch('/files?recursive=true&limit=400');
      if (!response.ok) return;
      const data = await response.json();
      state.files = data.entries || [];
      renderTree();
      $('filesCount').textContent = `${data.count}${data.truncated ? '+' : ''}`;
    } catch (err) {
      /* the pane is decorative: never break the chat */
    }
  }

  function renderTree() {
    const tree = $('tree');
    tree.textContent = '';
    const root = { dirs: new Map(), files: [] };

    state.files.forEach((entry) => {
      const parts = String(entry.name).split(/[/\\]/).filter(Boolean);
      let node = root;
      for (let index = 0; index < parts.length - 1; index += 1) {
        if (!node.dirs.has(parts[index])) node.dirs.set(parts[index], { dirs: new Map(), files: [] });
        node = node.dirs.get(parts[index]);
      }
      if (entry.type === 'dir') {
        if (!node.dirs.has(parts[parts.length - 1])) {
          node.dirs.set(parts[parts.length - 1], { dirs: new Map(), files: [] });
        }
      } else {
        node.files.push(entry);
      }
    });

    const freshUntil = Date.now() / 1000 - 600;
    const build = (node, depth, container) => {
      [...node.dirs.entries()].sort().forEach(([name, child]) => {
        const row = el('div', 'tnode dir');
        row.style.paddingLeft = 7 + depth * 13 + 'px';
        const chev = icon('chev', 'i-sm chev');
        row.appendChild(chev);
        row.appendChild(el('span', 'nm', name));
        container.appendChild(row);
        const kids = el('div');
        container.appendChild(kids);
        row.addEventListener('click', () => {
          const open = kids.hidden;
          kids.hidden = !open;
          chev.classList.toggle('open', open);
        });
        kids.hidden = depth > 0;
        chev.classList.toggle('open', depth === 0);
        build(child, depth + 1, kids);
      });
      node.files.sort((a, b) => a.name.localeCompare(b.name)).forEach((entry) => {
        const name = String(entry.name).split(/[/\\]/).pop();
        const row = el('div', 'tnode');
        row.style.paddingLeft = 7 + depth * 13 + 'px';
        row.appendChild(icon('file', 'i-sm'));
        row.appendChild(el('span', 'nm', name));
        if (entry.modified && entry.modified > freshUntil) row.appendChild(el('span', 'fresh'));
        row.title = entry.path;
        row.addEventListener('click', () => {
          document.querySelectorAll('.tnode.sel').forEach((n) => n.classList.remove('sel'));
          row.classList.add('sel');
          openFile(entry);
        });
        container.appendChild(row);
      });
    };
    build(root, 0, tree);
  }

  function markFresh(path) {
    const freshUntil = Date.now() / 1000 - 600;
    const match = state.files.find((entry) => entry.path === path);
    if (match) match.modified = Date.now() / 1000;
    else state.files.push({ name: String(path).split(/[/\\]/).pop(), path, type: 'file', size: 0, modified: Date.now() / 1000 });
    renderTree();
    void freshUntil;
  }

  async function openFile(entry) {
    state.selected = entry;
    $('filePath').textContent = entry.path || entry.name;
    $('fileBody').className = '';
    $('fileBody').textContent = 'loading…';
    try {
      const response = await fetch('/files/content?path=' + encodeURIComponent(entry.path));
      if (!response.ok) {
        const detail = await response.text();
        $('fileBody').className = 'placeholder';
        $('fileBody').textContent = `cannot read this file (${response.status}): ${detail.slice(0, 400)}`;
        return;
      }
      const data = await response.json();
      $('fileBody').textContent = data.content;
      $('copyFile').disabled = false;
    } catch (err) {
      $('fileBody').className = 'placeholder';
      $('fileBody').textContent = 'cannot read this file: ' + err;
    }
  }

  $('copyFile').addEventListener('click', async () => {
    const text = $('fileBody').textContent;
    try {
      await navigator.clipboard.writeText(text);
      $('copyFile').classList.add('on');
      setTimeout(() => $('copyFile').classList.remove('on'), 900);
    } catch (err) { /* clipboard is best effort */ }
  });
  $('refreshFiles').addEventListener('click', refreshFiles);

  /* ---------------- chrome ---------------- */
  function setSessionBadge() {
    $('session').textContent = state.sessionId ? state.sessionId.replace('sess_', '') : '—';
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/health');
      const data = await response.json();
      const up = data.ollama_reachable && data.model_loaded;
      const state = !data.ollama_reachable
        ? ' (offline)'
        : !data.model_loaded
          ? ' (not pulled)'
          : data.model_running
            ? ' (resident)'
            : ' (idle)';
      $('dot').className = 'dot ' + (up ? 'up' : 'down');
      $('model').textContent = data.model + state;
      $('model').title = data.model_running && data.model_expires_at
        ? 'loaded until ' + data.model_expires_at
        : 'loaded on demand (first request), unloaded after Ollama keep_alive';
      $('ver').textContent = 'v' + data.version;
    } catch (err) {
      $('dot').className = 'dot down';
      $('model').textContent = 'offline';
    }
  }

  $('composer').addEventListener('submit', (event) => {
    event.preventDefault();
    if (!state.busy) streamMessage();
  });

  $('message').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      if (!state.busy) streamMessage();
    }
  });
  $('message').addEventListener('input', () => {
    const node = $('message');
    node.style.height = 'auto';
    node.style.height = Math.min(node.scrollHeight, 190) + 'px';
  });

  $('stop').addEventListener('click', () => {
    if (state.controller) state.controller.abort();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && state.controller) state.controller.abort();
  });

  const toggleStream = () => {
    const drawer = $('drawer');
    drawer.hidden = !drawer.hidden;
    $('streamBtn').classList.toggle('on', !drawer.hidden);
    $('streamBtn').setAttribute('aria-expanded', String(!drawer.hidden));
  };
  $('streamBtn').addEventListener('click', toggleStream);
  $('hideEvents').addEventListener('click', toggleStream);

  /* Ctrl/Cmd+B toggles the workspace, Ctrl/Cmd+J the event stream */
  document.addEventListener('keydown', (event) => {
    if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
    const key = event.key.toLowerCase();
    if (key === 'b') {
      event.preventDefault();
      if (window.matchMedia('(min-width: 851px)').matches) {
        $('collapseWs').click();
      } else {
        document.body.classList.toggle('ws-open');
      }
    } else if (key === 'j') {
      event.preventDefault();
      toggleStream();
    }
  });

  $('drawerGrip').addEventListener('dblclick', () => {
    $('drawer').style.height = '';
    localStorage.removeItem('nour.ui.drawerHeight');
  });

  $('clearEvents').addEventListener('click', () => {
    $('eventsView').textContent = '';
    state.events = 0;
    state.toolIds.clear();
    updateStats();
  });

  $('newSession').addEventListener('click', async () => {
    if (state.sessionId) {
      try { await fetch(`/sessions/${state.sessionId}`, { method: 'DELETE' }); } catch (err) { /* ignore */ }
    }
    state.sessionId = null;
    localStorage.removeItem('nour-code-session');
    setSessionBadge();
    $('transcript').textContent = '';
    state.proposals.clear();
    state.toolIds.clear();
    state.usage = { total_tokens: 0 };
  });

  /* ---------------- boot ---------------- */
  applyTheme();
  syncOpts();
  setSessionBadge();
  updateStats();
  refreshStatus();
  refreshFiles();
  setInterval(refreshStatus, 20000);
  $('message').focus();
})();
</script>
</body>
</html>
